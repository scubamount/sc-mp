# SPDX-License-Identifier: GPL-3.0-only
# sco-relay example settings. Copy this file, change at least the passphrase and max_players, and
# start the server with the copy: sco-relay my.conf. Every setting the server knows is listed
# here, one comment line each; changing one never needs a rebuild. A line starting with # is a
# comment, and a # inside a value is part of the value. The server refuses to start while the
# passphrase below is still the placeholder, because anyone can read it here.

# The UDP port the server listens on; open it in your firewall. Players' games cannot join a port below 1024.
port = 64091

# The secret every player types to join: 12 to 128 bytes, a long sentence is best. This one is a placeholder, change it.
passphrase = CHANGE-ME-to-a-long-secret-sentence

# How many players the server accepts, the server itself not counted; the network library allows 15 at most.
max_players = 15

# The name players see for the server, which is peer 1 in their list.
server_name = sco-relay

# Extra IPv4 ranges players may come from, each /8 or narrower, on top of loopback and the private ranges (127/8, 10/8, 172.16/12, 192.168/16, 169.254/16). None by default. The line below is only an example, for a Tailscale VPN: remove the # only if your players come through it, and use the range yours use.
# allowed_addresses = 100.64.0.0/10

# Network timer, in milliseconds: how long a half-finished join is kept before it is dropped.
join_timeout_ms = 10000

# Network timer: how long to wait before a lost message is sent again; the wait doubles up to max_resend_ms.
resend_ms = 200

# Network timer: the longest wait between two sends of the same lost message.
max_resend_ms = 2000

# Network timer: how long a quiet link may stay silent before the server pings it; must be smaller than peer_timeout_ms, and at most 7500, a quarter of the 30000 ms after which a player's game drops a server it has not heard from.
keepalive_ms = 1000

# Network timer: how long a player may stay silent before the server drops them as timed out.
peer_timeout_ms = 30000

# The longest the server sleeps between two passes of its loop (a datagram ends the sleep at once); at most resend_ms.
loop_wait_ms = 5

# How often the server repeats its relay.info message to the players, in ms, at least 1000: a client that asks for it late gets it within this time.
announce_interval_ms = 5000

# How often the server writes its stats line (players, bytes, round time), in ms, at least 1000.
stats_interval_ms = 60000

# How much the server writes to its log: error (problems only), warn (also dropped addresses), info or debug.
log_level = info

# Nearby-only: on sends each player's position and pose only to the players near them, in the same area, instead of to everybody. It cuts the traffic a big session needs, and it needs a player-side plugin that speaks the nearby messages (multiplayer.near_up). off sends every pose to every player, as the network library relays them.
nearby_only = off

# Nearby-only: how far apart two players in the same area may be, in metres, and still get each other's poses. Keep it above 10000, the distance at which the plugin shows players, or they appear and vanish at the edge.
nearby_distance_m = 12000

# Nearby-only: how old a player's last position may be, in ms, at least 500. A player whose position is missing or older than this is sent every pose for this long, so a player who has just joined or is loading still sees others; after that it is sent none until it reports a position again.
nearby_stale_ms = 2000
